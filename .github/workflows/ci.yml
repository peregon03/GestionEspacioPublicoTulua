name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Create local.properties from secrets
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > local.properties

      - name: Build Mock Debug APK
        run: gradle assembleMockDebug

      - name: Run Lint (Mock Debug)
        run: gradle lintMockDebug
        continue-on-error: true

      - name: Run Unit Tests (Mock Debug)
        run: gradle testMockDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mock-debug-apk
          path: app/build/outputs/apk/mock/debug/*.apk
          retention-days: 7

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
